name: iOS signed build and optional TestFlight upload
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-distribution
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check optional upload configuration
        if: inputs.upload_to_testflight
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPSTORE_API_KEY_ID" && test -n "$APPSTORE_ISSUER_ID" && test -n "$APPSTORE_API_PRIVATE_KEY" || {
            echo 'Configure App Store Connect API credentials before requesting an upload.'; exit 1;
          }
      - name: Restore distribution signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: python3 scripts/prepare-signing.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive signed application and extension
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/SalsaTrainer.xcodeproj -scheme SalsaTrainer \
            -destination 'generic/platform=iOS' -archivePath build/StepByStep.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            APP_PROFILE_UUID="$APP_PROFILE_UUID" SHARE_PROFILE_UUID="$SHARE_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"
      - name: Export App Store IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/StepByStep.xcarchive \
            -exportOptionsPlist "$IOS_SIGNING_DIR/ExportOptions.plist" -exportPath build/export
          test -f build/export/SalsaTrainer.ipa
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepByStep-AppStore-IPA
          path: build/export/SalsaTrainer.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to TestFlight
        if: inputs.upload_to_testflight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/export/SalsaTrainer.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Remove temporary signing material
        if: always()
        run: bash scripts/cleanup-signing.sh
